// The Sealed Duels state-machine plugin, from `yano.sh appchain plugin scaffold`.
//
// It compiles against the host API only (compileOnly), so the JAR never packages
// Yano classes. By default that API comes from the extracted Yano X distribution's
// own yano.jar, so the plugin targets exactly the host it will run on:
//
//   ./gradlew build -PyanoJar=/path/to/yano-x-jvm-<version>/yano.jar
//
// or from Maven Central with -PyanoVersion=<host version> (see the distribution's
// yano-distribution-v1.json).
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

def yanoJar = providers.gradleProperty('yanoJar')
    .orElse(providers.provider {
        def dist = rootProject.file('../..').listFiles().find { it.name.startsWith('yano-x-jvm-') && it.isDirectory() }
        dist ? new File(dist, 'yano.jar').path : null
    })
def yanoVersion = providers.gradleProperty('yanoVersion')

dependencies {
    if (yanoVersion.isPresent()) {
        compileOnly "org.yanoproject:yano-core-api:${yanoVersion.get()}"
    } else {
        compileOnly files(yanoJar.get())
    }
    testImplementation files(yanoJar.getOrElse(''))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
    archiveFileName = 'sealed-duels-yano-plugin.jar'
}

test {
    useJUnitPlatform()
    // The shared vectors are generated by the browser rules: ../test/duel-vectors.mjs
    systemProperty 'vectors', rootProject.file('src/test/resources/duel-vectors.json').path
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
